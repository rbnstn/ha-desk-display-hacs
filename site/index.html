<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Desk Display · Interactive demo</title><style>body{font:16px system-ui;background:#101018;color:#eee;margin:0}main{max-width:1100px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:32px;margin:0}p{color:#c6c3d2;line-height:1.6}a{color:#91caff}button,select{background:#292436;color:#eee;border:1px solid #564f68;border-radius:10px;padding:12px;cursor:pointer}button[aria-selected=true]{background:#6750a4}nav{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0}.grid{display:grid;grid-template-columns:2fr 1fr;gap:24px}.display{padding:20px;background:#08070a;border-radius:22px;border:1px solid #443c50;box-shadow:0 16px 50px #0007}canvas{display:block;width:100%;aspect-ratio:3/2;touch-action:none;border-radius:12px}.settings{background:#211f29;padding:24px;border-radius:18px}label{display:block;margin:18px 0}input[type=range]{display:block;width:100%;accent-color:#ba9cff}output{float:right;font-variant-numeric:tabular-nums}footer{margin:30px 0;font-size:14px}@media(max-width:700px){.grid{grid-template-columns:1fr}main{padding:18px}h1{font-size:24px}}</style><main><header><h1>Desk Display</h1><button id="language">English</button></header><p id="intro"></p><nav id="tabs"></nav><div class="grid"><div><div class="display"><canvas width="960" height="640" aria-label="Interaktive Displayvorschau"></canvas></div><p id="hint"></p></div><aside class="settings"><h2 id="settingsTitle"></h2><label><span data-text="solar"></span><output id="solarOut"></output><input id="solar" type="range" min="0" max="8000" value="4100" step="50"></label><label><span data-text="battery"></span><output id="batteryOut"></output><input id="battery" type="range" min="0" max="100" value="83"></label><label><span data-text="wallbox"></span><output id="wallboxOut"></output><input id="wallbox" type="range" min="0" max="11000" value="1400" step="100"></label><label><span data-text="car"></span><output id="carOut"></output><input id="car" type="range" min="0" max="100" value="66"></label><label><span data-text="theme"></span> <select id="theme"><option value="dark">Dark</option><option value="light">Light</option></select></label><button id="reset"></button></aside></div><footer><a href="install.html" id="installLink"></a> · <a href="https://github.com/rbnstn/ha-desk-display-hacs">GitHub / HACS</a><p id="disclaimer"></p></footer></main><script>
const text={de:{intro:'Dein Home-Assistant-Dashboard auf einem E32R35T Touchdisplay. Probiere Energiefluss, Batteriestand, Wallbox und frei verschiebbare Anzeigen aus.',tabs:['Energiefluss','Dashboard','Tagesenergie','Kalender'],settings:'Beispielwerte',solar:'Solarleistung',battery:'Batteriestand',wallbox:'Wallbox',car:'Auto-Ladestand',theme:'Design',reset:'Zurücksetzen',hint:'Werte ändern sich sofort. Im Dashboard lassen sich die Karten verschieben.',install:'Im Browser installieren / wiederherstellen',disclaimer:'Diese Demo verwendet simulierte Werte und eine vereinfachte Browserdarstellung. Der echte Designer in Home Assistant rendert mit Pillow, speichert Layouts und steuert dein Display.',house:'Haus',grid:'Netz',solarName:'Solar',batteryName:'Batterie',carName:'Auto',target:'Ladeziel 80 %',energy:'Energie heute',calendar:'Nächste Termine',events:['08:00 · Schule','14:30 · Familie','Morgen · Papiermüll'],generation:'Erzeugung',consumption:'Verbrauch',export:'Einspeisung',import:'Bezug',autarky:'Autarkie',self:'Eigenverbrauch',temperature:'Temperatur',light:'Licht',on:'Ein',off:'Aus'},en:{intro:'Your Home Assistant dashboard on an E32R35T touch display. Try energy flow, battery charge, EV charging and draggable dashboard cards.',tabs:['Energy flow','Dashboard','Daily energy','Calendar'],settings:'Sample values',solar:'Solar power',battery:'Battery charge',wallbox:'EV charger',car:'Car charge',theme:'Theme',reset:'Reset',hint:'Values update immediately. Drag cards on the dashboard to try arranging them.',install:'Install / recover in your browser',disclaimer:'This demo uses simulated data and a simplified browser rendering. The real Home Assistant designer renders with Pillow, saves layouts and controls your display.',house:'Home',grid:'Grid',solarName:'Solar',batteryName:'Battery',carName:'Car',target:'Charge target 80 %',energy:'Energy today',calendar:'Upcoming events',events:['08:00 · School','14:30 · Family','Tomorrow · Paper collection'],generation:'Generation',consumption:'Consumption',export:'Export',import:'Import',autarky:'Self sufficiency',self:'Self consumption',temperature:'Temperature',light:'Light',on:'On',off:'Off'}};
let lang='de',page=0,on=false,cards=[{x:16,y:16,w:215,h:112},{x:249,y:16,w:215,h:112},{x:16,y:146,w:215,h:112},{x:249,y:146,w:215,h:112}];const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');ctx.scale(2,2);
function power(v){return v>=1000?(v/1000).toFixed(2).replace('.',lang==='de'?',':'.')+' kW':v+' W';}
function rounded(x,y,w,h,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();}
function label(value,x,y,size=14,color='#eee',align='center'){ctx.fillStyle=color;ctx.font=`${size}px system-ui`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(value,x,y);}
function draw(){const t=text[lang],light=document.querySelector('#theme').value==='light',bg=light?'#fffbff':'#14121a',surface=light?'#f0eaf5':'#24202e',fg=light?'#211a28':'#eee';const solar=+document.querySelector('#solar').value,battery=+document.querySelector('#battery').value,wallbox=+document.querySelector('#wallbox').value,car=+document.querySelector('#car').value;for(const id of ['solar','wallbox'])document.querySelector('#'+id+'Out').textContent=power(+document.querySelector('#'+id).value);for(const id of ['battery','car'])document.querySelector('#'+id+'Out').textContent=document.querySelector('#'+id).value+' %';ctx.fillStyle=bg;ctx.fillRect(0,0,480,320);
if(page===0){const nodes=[[80,85,t.solarName,power(solar),'#ffbd59'],[240,165,t.house,power(2200),'#9c9fff'],[400,85,t.grid,power(Math.max(0,2200+wallbox-solar)),'#70c8f5'],[80,245,t.batteryName,battery+' %','#69d8ac'],[400,245,t.carName,car+' %','#bd9aff']];for(const [x,y,,,color] of nodes.filter((_,i)=>i!==1)){ctx.strokeStyle=color;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x,165,240,165);ctx.stroke();}for(const [x,y,name,value,color] of nodes){ctx.fillStyle=surface;ctx.strokeStyle=color;ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,43,0,Math.PI*2);ctx.fill();ctx.stroke();label(name,x,y-16,12,fg);label(value,x,y+4,18,color);if(name===t.carName)label(power(wallbox),x,y+24,10,fg);}label(t.target,240,291,13,fg);}
if(page===1){for(const [index,c] of cards.entries()){rounded(c.x,c.y,c.w,c.h,16,surface);label([t.temperature,t.solarName,t.batteryName,t.light][index],c.x+14,c.y+23,14,fg,'left');label(['23,4 °C',power(solar),battery+' %',on?t.on:t.off][index],c.x+c.w-14,c.y+75,28,index===3?'#c8a7ff':fg,'right');}label('12:34 · Desk Display',240,292,14,fg);}
if(page===2){label(t.energy,24,30,20,fg,'left');const values=[[t.generation,'18,20 kWh'],[t.consumption,'12,40 kWh'],[t.export,'5,80 kWh'],[t.import,'1,10 kWh'],[t.autarky,'91 %'],[t.self,'68 %']];values.forEach(([title,value],i)=>{const x=16+(i%2)*233,y=56+Math.floor(i/2)*78;rounded(x,y,215,64,12,surface);label(title,x+12,y+17,12,fg,'left');label(value,x+200,y+43,23,fg,'right');});}
if(page===3){label(t.calendar,24,32,22,fg,'left');t.events.forEach((event,i)=>{rounded(16,68+i*74,448,60,14,surface);label(event,32,98+i*74,19,fg,'left');});}}
function localize(){const t=text[lang];document.documentElement.lang=lang;document.querySelector('#language').textContent=lang==='de'?'English':'Deutsch';for(const [id,key] of [['intro','intro'],['settingsTitle','settings'],['reset','reset'],['hint','hint'],['installLink','install'],['disclaimer','disclaimer']])document.querySelector('#'+id).textContent=t[key];for(const node of document.querySelectorAll('[data-text]'))node.textContent=t[node.dataset.text];const tabs=document.querySelector('#tabs');tabs.replaceChildren();t.tabs.forEach((name,i)=>{const button=document.createElement('button');button.textContent=name;button.setAttribute('aria-selected',String(i===page));button.onclick=()=>{page=i;localize();};tabs.append(button);});draw();}
for(const input of document.querySelectorAll('input,select'))input.oninput=draw;document.querySelector('#language').onclick=()=>{lang=lang==='de'?'en':'de';localize();};document.querySelector('#reset').onclick=()=>{for(const [id,value] of [['solar',4100],['battery',83],['wallbox',1400],['car',66]])document.querySelector('#'+id).value=value;cards=[{x:16,y:16,w:215,h:112},{x:249,y:16,w:215,h:112},{x:16,y:146,w:215,h:112},{x:249,y:146,w:215,h:112}];on=false;draw();};
let drag=null;const point=e=>{const box=canvas.getBoundingClientRect();return {x:(e.clientX-box.left)*480/box.width,y:(e.clientY-box.top)*320/box.height};};canvas.onpointerdown=e=>{if(page!==1)return;const p=point(e);for(let i=cards.length-1;i>=0;i--){const c=cards[i];if(p.x>=c.x&&p.x<=c.x+c.w&&p.y>=c.y&&p.y<=c.y+c.h){drag={c,dx:p.x-c.x,dy:p.y-c.y,index:i,moved:false};canvas.setPointerCapture(e.pointerId);break;}}};canvas.onpointermove=e=>{if(!drag)return;const p=point(e);drag.c.x=Math.max(0,Math.min(480-drag.c.w,Math.round((p.x-drag.dx)/8)*8));drag.c.y=Math.max(0,Math.min(276-drag.c.h,Math.round((p.y-drag.dy)/8)*8));drag.moved=true;draw();};canvas.onpointerup=()=>{if(drag&&!drag.moved&&drag.index===3)on=!on;drag=null;draw();};canvas.onpointercancel=()=>drag=null;localize();
</script></html>
