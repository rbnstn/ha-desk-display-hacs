name: Firmware build and release
on:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - 'custom_components/desk_display/manifest.json'
      - '.github/workflows/firmware.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firmware-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'platformio==6.1.18'
      - name: Require a build without embedded credentials
        run: test ! -e firmware/include/secrets.h
      - run: pio run --project-dir firmware
        env:
          SOURCE_DATE_EPOCH: '0'
      - name: Package firmware and checksum
        run: python firmware/scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: desk-display-firmware
          path: dist/
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: desk-display-firmware
          path: dist/
      - name: Attach firmware to the matching published HACS release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python firmware/scripts/publish_release.py
