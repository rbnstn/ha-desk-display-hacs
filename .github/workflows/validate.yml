name: HACS validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # A license choice is required before submitting to the default catalog.
          # This repository is distributed as a custom repository for now.
          ignore: license

