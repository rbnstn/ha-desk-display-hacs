[env:e32r35t]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/configure_jpeg.py
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  bodmer/TJpg_Decoder@1.1.0
build_flags =
  -D USER_SETUP_LOADED=1
  -D ST7796_DRIVER=1
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D SPI_FREQUENCY=40000000
  -D TOUCH_CS=33
  -D SPI_TOUCH_FREQUENCY=2500000
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1

